# Ishlatish:
#
# A) VPS da faqat bu stack + avtomatik HTTPS (Caddy 80/443):
#    docker compose -f docker-compose.prod.yml --profile tls-caddy up -d
#
# B) Tashqida allaqachon nginx (boshqa sayt 80/443 da) — Caddy ISHLATMASLIK:
#    docker compose -f docker-compose.prod.yml down --remove-orphans
#    docker compose -f docker-compose.prod.yml up -d
#    Keyin nginx upstream lar — .env dagi WEB_PUBLISH_PORT / API_PUBLISH_PORT (default 13080 va 14080).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-furniture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-furniture_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/mebel-erp-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "127.0.0.1:${API_PUBLISH_PORT:-14080}:4000"
    volumes:
      - api_uploads:/app/apps/api/.local/upload-images
    working_dir: /app/apps/api
    command:
      [
        "sh",
        "-c",
        "cd /app && pnpm --filter api exec prisma migrate deploy && exec node apps/api/dist/main.js",
      ]

  web:
    image: ghcr.io/${GHCR_OWNER}/mebel-erp-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: http://api:4000
      AUTH_INTERNAL_ORIGIN: ${AUTH_INTERNAL_ORIGIN:?Set AUTH_INTERNAL_ORIGIN in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
    ports:
      - "127.0.0.1:${WEB_PUBLISH_PORT:-13080}:3000"

  caddy:
    profiles:
      - tls-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  postgres_data:
  api_uploads:
  caddy_data:
  caddy_config:
