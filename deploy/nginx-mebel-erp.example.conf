# /etc/nginx/sites-available/mebel-erp.conf ga nusxa olib server_name va upstream portlarni .env dagi
# WEB_PUBLISH_PORT / API_PUBLISH_PORT ga moslang. SSL uchun: certbot --nginx -d erp.example.com -d api.example.com

upstream mebel_web {
    server 127.0.0.1:13080;
}

upstream mebel_api {
    server 127.0.0.1:14080;
}

server {
    listen 80;
    server_name erp.example.com;

    location / {
        proxy_pass http://mebel_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://mebel_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
