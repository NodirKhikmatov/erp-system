# /etc/nginx/sites-available/mebel-erp.conf ga nusxa.
# Upstream portlar: deploy/.env dagi WEB_PUBLISH_PORT / API_PUBLISH_PORT (default 13080 / 14080).
#
# --- Bitta domen (subdomen yo‘q) ---
# - petpawfectly.shop → A → VPS_IP (masalan 158.247.234.119)
# - www kerak bo‘lsa: www → A yoki CNAME → apex yoki VPS_IP (yo‘q bo‘lsa server_name dan www ni olib tashlang)
# Ortiqcha AAAA / boshqa hosting A yozuvlari LE ni buzadi — faqat VPS ga ishonchli yozuvlar qolsin.
#
# Let's Encrypt (faqat kerakli hostname lar):
#   dig +short petpawfectly.shop A
#   VPS_IP chiqishi kerak.
#
# HTTPS:
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d petpawfectly.shop
#   # www ishlatsangiz:   ... -d petpawfectly.shop -d www.petpawfectly.shop
#   keyin ssl bloklarini qo‘shing yoki: sudo certbot --nginx ...

upstream mebel_web {
    server 127.0.0.1:13080;
}

upstream mebel_api {
    server 127.0.0.1:14080;
}

# --- Web (Next.js) + ochiq uploadlar (/uploads/* API da); JSON API asosan SSR /api/proxy ---
server {
    listen 80;
    server_name petpawfectly.shop www.petpawfectly.shop;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # PUBLIC_UPLOAD_BASE_URL bilan bir xil host — brauzer rasmlarni shu yo‘l bilan oladi
    location ^~ /uploads/ {
        proxy_pass http://mebel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        client_max_body_size 25m;
    }

    location / {
        proxy_pass http://mebel_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
