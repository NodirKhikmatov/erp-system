services:
  # Host 5433-porti mahalliy PostgreSQL 5432 bilan to‘qnashmasligi uchun.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: furniture
      POSTGRES_PASSWORD: furniture
      POSTGRES_DB: furniture_erp
    ports:
      - "5433:5432"
    volumes:
      - furniture_erp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furniture -d furniture_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  furniture_erp_pg:
