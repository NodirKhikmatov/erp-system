name: Vultr SSH deploy
description: GHCR ga login va serverda compose pull/up

inputs:
  host:
    required: true
  username:
    required: true
  ssh_key:
    required: true
  ghcr_token:
    required: true
  ghcr_username:
    required: true
  deploy_path:
    required: true

runs:
  using: composite
  steps:
    - id: sanitize_paths
      shell: bash
      env:
        RAW_DP: ${{ inputs.deploy_path }}
      run: |
        dr=$(printf '%s' "$RAW_DP" | tr -d '\r\n')
        echo "deploy_root=$dr" >> "$GITHUB_OUTPUT"

    - name: SSH — compose pull/up
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key: ${{ inputs.ssh_key }}
        script: |
          set -euo pipefail
          ROOT="${{ steps.sanitize_paths.outputs.deploy_root }}"
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/deploy" ]; then
            echo "::error::Serverda yo'l yo'q yoki deploy papkasi topilmadi: $ROOT/deploy"
            exit 1
          fi
          echo "${{ inputs.ghcr_token }}" | docker login ghcr.io -u "${{ inputs.ghcr_username }}" --password-stdin
          cd "$ROOT/deploy"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
