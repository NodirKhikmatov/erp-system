name: Vultr SSH deploy
description: GHCR ga login va serverda compose pull/up

inputs:
  host:
    required: true
  username:
    required: true
  # PEM multiline yoki bo‘sh (faqat ssh_key_b64 bo‘lsa ham bo‘ladi).
  ssh_key:
    required: false
    default: ""
  # `cat ~/.ssh/vultr_deploy | base64 -w0` (Mac: base64 | tr -d '\n'). Yangi qator yo‘q — kesilish kamayadi.
  ssh_key_b64:
    required: false
    default: ""
  ghcr_token:
    required: true
  ghcr_username:
    required: true
  deploy_path:
    required: true

runs:
  using: composite
  steps:
    - id: check_secrets
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.username }}
        SSH_KEY: ${{ inputs.ssh_key }}
        SSH_KEY_B64: ${{ inputs.ssh_key_b64 }}
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
        GHCR_USER: ${{ inputs.ghcr_username }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}
      run: |
        missing=()
        [ -z "$HOST" ]        && missing+=("VULTR_HOST")
        [ -z "$USER" ]        && missing+=("VULTR_USER")
        [ -z "$SSH_KEY" ] && [ -z "$SSH_KEY_B64" ] && missing+=("VULTR_SSH_KEY yoki VULTR_SSH_KEY_B64")
        [ -z "$GHCR_TOKEN" ]  && missing+=("GHCR_READ_TOKEN")
        [ -z "$GHCR_USER" ]   && missing+=("GHCR_USERNAME")
        [ -z "$DEPLOY_PATH" ] && missing+=("VULTR_DEPLOY_PATH")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Yetishmayotgan GitHub Secrets: ${missing[*]}"
          echo "::error::Repo → Settings → Secrets and variables → Actions → Secrets tab da qo'shing."
          exit 1
        fi

    - id: sanitize_paths
      shell: bash
      env:
        RAW_DP: ${{ inputs.deploy_path }}
      run: |
        dr=$(printf '%s' "$RAW_DP" | tr -d '\r\n')
        echo "deploy_root=$dr" >> "$GITHUB_OUTPUT"

    # Multiline kalitni `key:` orqali berish ba'zan buziladi — fayl + key_path ishonchliroq.
    # Ba'zan Secret bir qator + literal \n bo'ladi; ssh.ParsePrivateKey xato: "ssh: no key found".
    - id: write_ssh_key
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
        SSH_KEY_B64: ${{ inputs.ssh_key_b64 }}
      run: |
        set -euo pipefail
        keyfile="${RUNNER_TEMP}/vultr_deploy.key"
        write_raw() { printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > "$keyfile"; }
        write_esc() { printf '%b' "$SSH_KEY" | sed 's/\r$//' > "$keyfile"; }
        write_decode_b64() {
          printf '%s' "$1" | tr -d '\r\n\t ' | base64 -d > "$keyfile" 2>/dev/null || return 1
          return 0
        }
        try_validate() {
          chmod 600 "$keyfile"
          ssh-keygen -y -f "$keyfile" -P '' >/dev/null 2>&1
        }
        ok=1
        if [ -n "${SSH_KEY_B64:-}" ]; then
          write_decode_b64 "$SSH_KEY_B64" && try_validate || ok=0
        else
          ok=0
        fi
        if [ "$ok" -ne 1 ] && [ -n "${SSH_KEY:-}" ]; then
          write_raw
          try_validate && ok=1 || ok=0
        fi
        if [ "$ok" -ne 1 ] && [ -n "${SSH_KEY:-}" ]; then
          write_esc
          try_validate && ok=1 || ok=0
        fi
        # Bir qator base64 ni xato PEM Secret ichiga qo‘ygan bo‘lsa
        if [ "$ok" -ne 1 ] && [ -n "${SSH_KEY:-}" ]; then
          write_decode_b64 "$SSH_KEY" && try_validate && ok=1 || ok=0
        fi
        if [ "$ok" -ne 1 ]; then
          echo "::error::Kalit o‘qilmadi (ssh-keygen). PEM kesilgan bo‘lishi mumkin — Actions bayt=$(wc -c < "$keyfile"), qatorlar=$(wc -l < "$keyfile")"
          echo "::error::Yechim: Repository Secret qo‘shing — nomi VULTR_SSH_KEY_B64, qiymati:"
          echo "::error::  macOS:  base64 -i ~/.ssh/vultr_deploy | tr -d '\n'"
          echo "::error::  Linux:  base64 -w0 ~/.ssh/vultr_deploy"
          echo "::error::Yoki VULTR_SSH_KEY ga bir necha qatorli TO‘LIQ PEM (odatda 350+ bayt)."
          exit 1
        fi
        if ! grep -qE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY' "$keyfile"; then
          echo "::error::VULTR_SSH_KEY BEGIN ... PRIVATE KEY bilan boshlanishi kerak."
          exit 1
        fi
        echo "key_file=$keyfile" >> "$GITHUB_OUTPUT"

    # drone-ssh (appleboy) ba'zi kalitlarda golang ssh.ParsePrivateKey bilan xato beradi.
    # Runner dagi OpenSSH — Mac dagi `ssh -i` bilan bir xil.
    - name: SSH — compose pull/up
      shell: bash
      env:
        KEY_FILE: ${{ steps.write_ssh_key.outputs.key_file }}
        SSH_HOST: ${{ inputs.host }}
        SSH_USER: ${{ inputs.username }}
        DEPLOY_ROOT: ${{ steps.sanitize_paths.outputs.deploy_root }}
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
        GHCR_USERNAME: ${{ inputs.ghcr_username }}
      run: |
        set -euo pipefail
        if [ -z "${KEY_FILE:-}" ] || [ ! -f "$KEY_FILE" ]; then
          echo "::error::SSH kalit fayli topilmadi (write_ssh_key chiqishi bo'sh)."
          exit 1
        fi
        shell_quote() { printf '%q' "$1"; }
        {
          printf '%s\n' 'set -euo pipefail'
          printf '%s\n' "ROOT=$(shell_quote "$DEPLOY_ROOT")"
          printf '%s\n' 'if [ ! -d "$ROOT/deploy" ]; then echo "::error::Deploy path missing on server: $ROOT/deploy"; exit 1; fi'
          printf '%s\n' "echo $(shell_quote "$GHCR_TOKEN") | docker login ghcr.io -u $(shell_quote "$GHCR_USERNAME") --password-stdin"
          printf '%s\n' 'cd "$ROOT/deploy"'
          printf '%s\n' 'docker compose -f docker-compose.prod.yml pull'
          printf '%s\n' 'docker compose -f docker-compose.prod.yml up -d --remove-orphans'
        } | ssh -i "$KEY_FILE" \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=accept-new \
          "${SSH_USER}@${SSH_HOST}" bash -s
