name: Vultr SSH deploy
description: GHCR ga login va serverda compose pull/up

inputs:
  host:
    required: true
  username:
    required: true
  ssh_key:
    required: true
  ghcr_token:
    required: true
  ghcr_username:
    required: true
  deploy_path:
    required: true

runs:
  using: composite
  steps:
    - id: check_secrets
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        USER: ${{ inputs.username }}
        SSH_KEY: ${{ inputs.ssh_key }}
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
        GHCR_USER: ${{ inputs.ghcr_username }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}
      run: |
        missing=()
        [ -z "$HOST" ]        && missing+=("VULTR_HOST")
        [ -z "$USER" ]        && missing+=("VULTR_USER")
        [ -z "$SSH_KEY" ]     && missing+=("VULTR_SSH_KEY")
        [ -z "$GHCR_TOKEN" ]  && missing+=("GHCR_READ_TOKEN")
        [ -z "$GHCR_USER" ]   && missing+=("GHCR_USERNAME")
        [ -z "$DEPLOY_PATH" ] && missing+=("VULTR_DEPLOY_PATH")
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::Yetishmayotgan GitHub Secrets: ${missing[*]}"
          echo "::error::Repo → Settings → Secrets and variables → Actions → Secrets tab da qo'shing."
          exit 1
        fi

    - id: sanitize_paths
      shell: bash
      env:
        RAW_DP: ${{ inputs.deploy_path }}
      run: |
        dr=$(printf '%s' "$RAW_DP" | tr -d '\r\n')
        echo "deploy_root=$dr" >> "$GITHUB_OUTPUT"

    # Multiline kalitni `key:` orqali berish ba'zan buziladi — fayl + key_path ishonchliroq.
    - id: write_ssh_key
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
      run: |
        keyfile="${RUNNER_TEMP}/vultr_deploy.key"
        printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > "$keyfile"
        chmod 600 "$keyfile"
        if ! grep -qE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY' "$keyfile"; then
          echo "::error::VULTR_SSH_KEY kaliti noto'g'ri (BEGIN ... PRIVATE KEY yo'q). GitHub Secret ga ~/.ssh/vultr_deploy faylining TO'LIQ matnini qo'ying."
          exit 1
        fi
        echo "path=$keyfile" >> "$GITHUB_OUTPUT"

    - name: SSH — compose pull/up
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ inputs.host }}
        username: ${{ inputs.username }}
        key_path: ${{ steps.write_ssh_key.outputs.path }}
        script: |
          set -euo pipefail
          ROOT="${{ steps.sanitize_paths.outputs.deploy_root }}"
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/deploy" ]; then
            echo "::error::Serverda yo'l yo'q yoki deploy papkasi topilmadi: $ROOT/deploy"
            exit 1
          fi
          echo "${{ inputs.ghcr_token }}" | docker login ghcr.io -u "${{ inputs.ghcr_username }}" --password-stdin
          cd "$ROOT/deploy"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
