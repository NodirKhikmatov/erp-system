# Vultr VPS da konteynerlarni yangilash (qo‘lda ishga tushirish).
#
# GitHub → Settings → Secrets and variables → Actions:
#   VULTR_HOST          masalan 155.x.x.x
#   VULTR_USER          odatda root
#   VULTR_SSH_KEY       private key (to‘liq PEM)
#   VULTR_DEPLOY_PATH   masalan /opt/mebel-erp  (ichida deploy/ papkasi bo‘lsin)
#   GHCR_USERNAME       GitHub username (image pull)
#   GHCR_READ_TOKEN     PAT: read:packages
#
# VPS bir marta sozlangan bo‘lishi kerak: Docker, docker compose, deploy papkasi + .env,
# va `echo TOKEN | docker login ghcr.io -u USER --password-stdin`.

name: Deploy to Vultr

on:
  workflow_dispatch:

jobs:
  ssh-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            cd "${{ secrets.VULTR_DEPLOY_PATH }}/deploy"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
