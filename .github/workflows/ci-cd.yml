name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: |
          Qo'lda ishga tushirish rejimi (tanlang).
          vultr_compose_only — faqat serverda pull/up (verify/docker yo'q).
        type: choice
        required: true
        default: ci_push_images
        options:
          - ci_push_images
          - ci_push_then_vultr
          - vultr_compose_only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  verify:
    # Qo'lda: vultr_compose_only da tekshiruv kerak emas
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'vultr_compose_only' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, tests
        run: pnpm verify

      - name: Production build
        run: pnpm build

  docker:
    needs: verify
    # PR da docker yo'q; qo'lda vultr_compose_only da ham yo'q
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'vultr_compose_only') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - dockerfile: apps/api/Dockerfile
            image: mebel-erp-api
          - dockerfile: apps/web/Dockerfile
            image: mebel-erp-web
    steps:
      - uses: actions/checkout@v5

      - name: GHCR image prefix (kichik harf)
        id: scope
        run: |
          owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${{ env.REGISTRY }}/${owner_lc}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.scope.outputs.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push API
        if: matrix.image == 'mebel-erp-api'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Web
        if: matrix.image == 'mebel-erp-web'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}

  deploy-vultr-after-docker:
    needs: docker
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'ci_push_then_vultr' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vultr deploy
        uses: ./.github/actions/vultr-ssh-deploy
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          ssh_key: ${{ secrets.VULTR_SSH_KEY }}
          ghcr_token: ${{ secrets.GHCR_READ_TOKEN }}
          ghcr_username: ${{ secrets.GHCR_USERNAME }}
          deploy_path: ${{ secrets.VULTR_DEPLOY_PATH }}

  deploy-vultr-only:
    # verify/docker dan mustaqil — skipped bo'lmasligi uchun alohida job
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'vultr_compose_only' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vultr deploy (faqat compose)
        uses: ./.github/actions/vultr-ssh-deploy
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          ssh_key: ${{ secrets.VULTR_SSH_KEY }}
          ghcr_token: ${{ secrets.GHCR_READ_TOKEN }}
          ghcr_username: ${{ secrets.GHCR_USERNAME }}
          deploy_path: ${{ secrets.VULTR_DEPLOY_PATH }}
